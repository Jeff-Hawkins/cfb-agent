name: Tuesday Stats Refresh
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year'
        required: true
        default: '2026'
      week:
        description: 'Week number'
        required: true
        default: '1'
  # schedule:
  #   - cron: '0 12 * * 2'   # Tuesdays noon ET — uncomment before August 2026

jobs:
  refresh-advanced-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Advanced Stats Refresh
        run: |
          curl -X POST \
            "${{ secrets.RAILWAY_URL }}/admin/stats/refresh?season=${{ github.event.inputs.season }}&week=${{ github.event.inputs.week }}" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}"
