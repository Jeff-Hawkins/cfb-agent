name: Sunday Pipeline
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year'
        required: true
        default: '2026'
      week:
        description: 'Week number'
        required: true
        default: '1'
  # schedule:
  #   - cron: '0 20 * * 0'   # Sundays 8pm ET — uncomment before August 2026

jobs:
  run-sunday-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sunday Pipeline
        run: |
          curl -X POST \
            "${{ secrets.RAILWAY_URL }}/admin/outcomes/refresh?season=${{ github.event.inputs.season }}&week=${{ github.event.inputs.week }}" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}"
